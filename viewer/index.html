<!doctype html>
<html lang="ko"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>BRICK · 모델 뷰어</title><link rel="icon" href="data:,"></head>
<body><main><header><strong>BRICK</strong><span>모델 뷰어</span></header><aside><h1>모델 살펴보기</h1><p>드래그해서 회전하고 스크롤해서 확대하세요.</p><label>만든 모델<select id="models"><option value="">모델 선택</option></select></label><button id="load" disabled>선택 모델 열기</button><label class="upload">내 기기에서 열기<input id="file" type="file" accept=".mpd,.ldr,.glb,.gltf"></label><p class="hint">선택한 파일은 서버로 업로드하지 않습니다.</p><details><summary>외부 모델 설정</summary><label>LDraw 부품 라이브러리 주소<input id="library" type="url" placeholder="https://…/ldraw/"></label><p class="hint">MPD의 외부 부품은 parts/와 p/가 있는 라이브러리가 필요합니다.</p></details><div id="pose-panel" hidden><h2>자세 검토</h2><p class="hint">화면상 가동 검토입니다. 실제 결합·하중·허용 각도는 아직 검증하지 않았습니다.</p><label>부위<select id="joint"></select></label><div id="joint-axes"></div><button id="pose-reset">기본 자세</button><button id="support-toggle">지지대 숨기기</button></div><div class="buttons"><button id="side-view" disabled>옆모습</button><button id="front-view" disabled>정면</button><button id="fit" disabled>전체 보기</button><button id="reset" disabled>숨김 초기화</button><button id="hide" disabled>선택 숨기기</button></div><p id="selection">부품을 클릭하면 선택됩니다.</p><output id="status" role="status">공개된 모델이 없습니다. 파일을 선택해서 시작하세요.</output><p id="summary"></p><p id="version"></p></aside><section id="viewport" aria-label="3D 모델"><div id="empty">BRICK<br><small>모델을 열어 검토를 시작하세요.</small></div></section></main><script type="module" src="/src/main.js"></script></body></html>
