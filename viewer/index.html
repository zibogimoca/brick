<!doctype html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>BRICK · 모델 뷰어</title>
  <link rel="icon" href="data:,">
</head>
<body>
<main>
  <aside aria-label="모델 조작">
    <h1>BRICK <span>모델 뷰어</span></h1>
    <section class="control-section">
      <label for="models">모델</label>
      <select id="models"><option value="">모델 선택</option></select>
    </section>
    <section class="control-section">
      <h2>시점</h2>
      <div class="buttons three">
        <button id="side-view" disabled>옆모습</button>
        <button id="front-view" disabled>정면</button>
        <button id="fit" disabled>전체 보기</button>
      </div>
      <p class="hint">드래그 회전 · 스크롤 확대</p>
    </section>
    <section id="pose-panel" class="control-section" hidden>
      <h2>자세</h2>
      <label class="sr-only" for="joint">가동 부위</label>
      <select id="joint"></select>
      <div id="joint-axes"></div>
      <div class="buttons two">
        <button id="pose-reset">기본 자세</button>
        <button id="support-toggle">지지대 숨기기</button>
      </div>
      <p class="hint">화면상 가동 검토 · 실물 범위 미검증</p>
    </section>
    <section class="control-section">
      <h2>부품</h2>
      <div class="buttons two">
        <button id="hide" disabled>선택 숨기기</button>
        <button id="reset" disabled>숨김 초기화</button>
      </div>
      <p id="selection" class="hint">부품을 클릭하면 선택됩니다.</p>
    </section>
    <div class="model-info">
      <output id="status" role="status">모델을 선택하세요.</output>
      <details><summary>모델 정보</summary><p id="summary"></p><p id="version"></p></details>
    </div>
  </aside>
  <section id="viewport" aria-label="3D 모델">
    <div id="empty">BRICK<small>모델을 선택하세요.</small></div>
  </section>
</main>
<script type="module" src="/src/main.js"></script>
</body>
</html>
